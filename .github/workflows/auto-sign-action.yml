name: auto-sign

on:
  schedule:
    # 每天 7:30 北京时间签到 (UTC 23:30)
    - cron: '30 23 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
    # 拉取代码
    - uses: actions/checkout@v3

    # 设置 Python 3.11（推荐新版本，兼容性更好）
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 安装 Java JRE（签到依赖的 temp.jar）
    - name: Setup Java JRE
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'
        

    # 缓存 pip 依赖，使用最新 actions/cache@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 安装系统依赖和 Python 包
    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
        curl -L -v -o temp.jar https://github.com/ZimoLoveShuang/wisedu-unified-login-api/releases/download/v1.0.8/wisedu-unified-login-api-v1.0.jar
        java -version
        python -m pip install --upgrade pip
        pip install setuptools flake8 wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Lint 检查代码
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 运行签到脚本
    - name: Run Auto Sign
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        SCHOOL: ${{ secrets.SCHOOL }}
        LOGIN_TYPE: ${{ secrets.LOGIN_TYPE }}
      run: |
        python index.py
