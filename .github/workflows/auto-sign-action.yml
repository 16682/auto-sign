name: Auto Sign

on:
  schedule:
    - cron: '0 7 * * *'  # 每天早上7点跑一次
  workflow_dispatch:      # 手动触发

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12  # 或者你本地用的版本

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到脚本
        run: python index.py
